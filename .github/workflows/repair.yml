name: repair-digest

on:
  workflow_dispatch:
    inputs:
      date:
        description: "要修复的日期（YYYY-MM-DD）"
        required: true
        type: string
      send_email:
        description: "修好后重发一封邮件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repair-digest
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Repair deep-read cards
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY || secrets.AGNES }}
        run: python -m pipeline.repair --date "${{ inputs.date }}" ${{ inputs.send_email && '--email' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data notes state
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "repair: ${{ inputs.date }} deep-read cards"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
